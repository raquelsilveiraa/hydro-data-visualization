name: Publish GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v4
      - name: Check the publishing bundle
        shell: bash
        run: |
          for page in index.html map_sensors_orgeval.html pzps1.html pzps3.html pzps4.html; do
            test -s "docs/$page"
          done
          test -f docs/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only the public website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
